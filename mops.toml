[package]
name = "meritocracy-icp"
version = "0.0.1"
description = "Pinned local-only ICP migration fixtures."
license = "AGPL-3.0-only"

[dependencies]
base = "0.16.0"
identify = "0.0.2"
sha2 = "0.1.6"

[toolchain]
moc = "0.16.3"
pocket-ic = "12.0.0"
wasmtime = "43.0.0"

[moc]
args = ["--default-persistent-actors"]

[canisters.core_canister]
main = "canisters/core/main.mo"

[canisters.core_canister.check-stable]
path = "canisters/core/core.most"

[canisters.workflow_canister]
main = "canisters/workflow/main.mo"

[canisters.workflow_canister.check-stable]
path = "canisters/workflow/workflow.most"

[canisters.treasury_canister]
main = "canisters/treasury/main.mo"

[canisters.treasury_canister.check-stable]
path = "canisters/treasury/treasury.most"

[canisters.frontend_canister]
main = "canisters/frontend/main.mo"

[canisters.frontend_canister.check-stable]
path = "canisters/frontend/frontend.most"

[canisters.oauth_attempt_fixture]
main = "canisters/oauth_attempt_fixture/main.mo"

[canisters.oauth_attempt_fixture.check-stable]
path = "canisters/oauth_attempt_fixture/oauth_attempt_fixture.most"

[canisters.private_store_recovery_fixture]
main = "fixtures/private_store_recovery/main.mo"

[canisters.private_store_recovery_fixture.check-stable]
path = "fixtures/private_store_recovery/private_store_recovery_fixture.most"

[canisters.private_store_recovery_v1_fixture]
main = "fixtures/private_store_recovery_v1/main.mo"

[canisters.private_store_recovery_v1_fixture.check-stable]
path = "fixtures/private_store_recovery_v1/private_store_recovery_v1_fixture.most"

[canisters.private_store_attacker_fixture]
main = "fixtures/private_store_attacker/main.mo"

[canisters.private_store_attacker_fixture.check-stable]
path = "fixtures/private_store_attacker/private_store_attacker_fixture.most"

[canisters.durable_journal_remote_fixture]
main = "fixtures/durable_journal_remote/main.mo"

[canisters.durable_journal_remote_fixture.check-stable]
path = "fixtures/durable_journal_remote/durable_journal_remote_fixture.most"

[canisters.durable_journal_recovery_fixture]
main = "fixtures/durable_journal_recovery/main.mo"

[canisters.durable_journal_recovery_fixture.check-stable]
path = "fixtures/durable_journal_recovery/durable_journal_recovery_fixture.most"

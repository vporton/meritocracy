# See:
# https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# https://chatgpt.com/share/695d0a21-5718-8001-a9ad-20ef8f8e09d1

name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: staging  # CRITICAL

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install
        run: |
          npm install
          npm run install-backend
          npm run install-frontend

      - name: Prisma code generator
        run: (cd backend && npx prisma generate)

      - name: Test build
        run: npm run build  # redundant, but need check that it builds

      # TODO@P3: Can it be simplified?
      - name: Check DB format integrity
        run: (export DATABASE_URL="file:///tmp/test.db" && npm run db:setup && cd backend && npx prisma migrate status)

      - name: Deploy to staging
        env:
          FLY_API_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: ./deploy/deploy-staging.sh

[dependencies]
# The upstream 0.0.2 backend modules are source-identical. This local package
# view intentionally excludes the upstream frontend E2E actor from the Motoko
# package search path; Motoko 1.4 rejects actors in a library package.
identify = "./third_party/identify-0.0.2-backend"
# `identify`'s transitive `hash` package imports this historical package name.
# Keep the import name for source compatibility, but resolve it to the exact
# Motoko 1.4.1-compatible motoko-base source rather than its pre-1.4 commit.
"base-0.7.3" = "https://github.com/dfinity/motoko-base#d1b336e142bec76577e3d63d9f1fac74de48df0a"
"base@0.7.3" = "https://github.com/dfinity/motoko-base#d1b336e142bec76577e3d63d9f1fac74de48df0a"

[toolchain]
moc = "1.4.1"
pocket-ic = "12.0.0"

[moc]
# Motoko 1.4 requires an explicit Candid definition for the management
# canister imported by the pinned `identify` package. The declaration is
# vendored at this exact path and hash for reproducible compiler resolution.
args = ["--actor-idl=canisters/shared/system_idl"]

[canisters.core_canister]
main = "canisters/core/main.mo"
candid = "canisters/core/core_canister.did"

[canisters.core_canister.check-stable]
path = "deployed/core_canister.most"

[canisters.workflow_canister]
main = "canisters/workflow/main.mo"
candid = "canisters/workflow/workflow_canister.did"

[canisters.workflow_canister.check-stable]
path = "deployed/workflow_canister.most"

[canisters.treasury_canister]
main = "canisters/treasury/main.mo"
candid = "canisters/treasury/treasury_canister.did"

[canisters.treasury_canister.check-stable]
path = "deployed/treasury_canister.most"

[canisters.archive_router]
main = "canisters/archive_router/main.mo"
candid = "canisters/archive_router/archive_router.did"

[canisters.archive_router.check-stable]
path = "deployed/archive_router.most"

[canisters.storage_authority]
main = "canisters/storage_authority/main.mo"
candid = "canisters/storage_authority/storage_authority.did"

[canisters.storage_authority.check-stable]
path = "deployed/storage_authority.most"

[canisters.oauth_fixture]
main = "canisters/oauth_fixture/main.mo"
candid = "canisters/oauth_fixture/oauth_fixture.did"

[canisters.oauth_fixture.check-stable]
path = "deployed/oauth_fixture.most"

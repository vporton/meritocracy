# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'meritocracy'
primary_region = 'iad'
# swap_size_mb = 512  # Machines with swap are not eligible to suspend

[deploy]
# TODO@P3 Having more than one machine would lead to duplicate cron tasks executing
# and to keep-alive ping going to a wrong machine.
# As a temporary solution, I remove the duplicators and leave just one machine deployed.
strategy = "rolling" # "bluegreen" # TODO@P3: Neither makes zero downtime :-(
max_unavailable = 1


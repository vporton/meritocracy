name: M1 treasury embedded payment-operation PocketIC proof

on:
  pull_request:
    paths:
      - 'canisters/treasury/EmbeddedPaymentOperationStore.mo'
      - 'canisters/treasury/PaymentOperationIntent.mo'
      - 'canisters/shared/MutationRecovery.mo'
      - 'fixtures/treasury/EmbeddedPaymentOperationStoreProof.mo'
      - 'scripts/icp/build-treasury-embedded-payment-operation-proof.sh'
      - 'scripts/icp/run-treasury-embedded-payment-operation-proof.sh'
      - 'scripts/icp/treasury-embedded-payment-operation-pocketic-proof.cjs'
      - 'scripts/icp/run-treasury-embedded-payment-operation-capacity-proof.sh'
      - 'scripts/icp/treasury-embedded-payment-operation-capacity-pocketic-proof.cjs'
      - 'scripts/icp/run-treasury-embedded-payment-operation-low-cycle-proof.sh'
      - 'scripts/icp/treasury-embedded-payment-operation-low-cycle-pocketic-proof.cjs'
      - '.github/workflows/m1-treasury-embedded-payment-operation.yml'
      - 'mops.toml'
      - 'mops.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocketic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm ci
      - name: Install locked Motoko dependencies
        run: node node_modules/ic-mops/dist/bin/mops.js install --lock check
      - name: Cache pinned PocketIC toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mops
            ~/.local/share/mops
          key: m1-treasury-payment-operation-pocketic-${{ runner.os }}-12.0.0-${{ hashFiles('mops.toml', 'mops.lock') }}
      - name: Build synthetic treasury fixture
        run: |
          mkdir -p .mops/m1-treasury-embedded-payment-operation-proof
          scripts/icp/build-treasury-embedded-payment-operation-proof.sh 2>&1 | tee .mops/m1-treasury-embedded-payment-operation-proof/build.log
      - name: Run synthetic treasury fixture
        run: |
          timeout 15m scripts/icp/run-treasury-embedded-payment-operation-proof.sh 2>&1 | tee .mops/m1-treasury-embedded-payment-operation-proof/proof.log
      - name: Run synthetic treasury capacity boundary
        run: |
          timeout 15m scripts/icp/run-treasury-embedded-payment-operation-capacity-proof.sh 2>&1 | tee .mops/m1-treasury-embedded-payment-operation-proof/capacity.log
      - name: Run synthetic treasury low-cycle boundary
        run: |
          timeout 15m scripts/icp/run-treasury-embedded-payment-operation-low-cycle-proof.sh 2>&1 | tee .mops/m1-treasury-embedded-payment-operation-proof/low-cycle.log
      - name: Retain proof artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-treasury-embedded-payment-operation-${{ github.run_id }}
          path: .mops/m1-treasury-embedded-payment-operation-proof
          if-no-files-found: warn
          retention-days: 14

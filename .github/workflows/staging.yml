# See:
# https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# https://chatgpt.com/share/695d0a21-5718-8001-a9ad-20ef8f8e09d1

name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: staging  # CRITICAL

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install
        run: |
          npm install

      - name: Prisma code generator
        run: (cd backend && npx prisma generate)

      - name: Test build
        run: npm run build  # redundant, but need check that it builds

      - name: Deploy to staging
        env:
          FLY_API_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: ./deploy/deploy-staging.sh

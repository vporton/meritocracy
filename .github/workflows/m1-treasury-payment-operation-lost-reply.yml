name: M1 treasury payment-operation PocketIC proof

on:
  pull_request:
    paths:
      - 'canisters/storage_authority/**'
      - 'canisters/shared/CycleReserve.mo'
      - 'canisters/shared/MutationRecovery.mo'
      - 'canisters/treasury/PaymentOperation*.mo'
      - 'fixtures/storage_authority/TreasuryPaymentOperationLostReply.mo'
      - 'fixtures/storage_authority/PaymentOperationArchiveSink.mo'
      - 'fixtures/storage_authority/PaymentOperationTransferSink.mo'
      - 'scripts/icp/*treasury-payment-operation-lost-reply*'
      - 'mops.toml'
      - 'mops.lock'
      - '.github/workflows/m1-treasury-payment-operation-lost-reply.yml'
  workflow_dispatch:

jobs:
  pocketic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm ci
      - name: Install locked Motoko dependencies
        run: node node_modules/ic-mops/dist/bin/mops.js install --lock check
      - name: Cache pinned PocketIC toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mops
            ~/.local/share/mops
          key: m1-treasury-payment-operation-pocketic-${{ runner.os }}-12.0.0-${{ hashFiles('mops.toml', 'mops.lock') }}
      - name: Build synthetic treasury, authority, archive, and transfer fixtures
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .mops/m1-treasury-payment-operation-lost-reply-proof
          scripts/icp/build-treasury-payment-operation-lost-reply-proof.sh 2>&1 | tee .mops/m1-treasury-payment-operation-lost-reply-proof/build.log
      - name: Run synthetic low-cycle, repair, archive, and at-most-one-dispatch proof
        shell: bash
        run: |
          set -o pipefail
          timeout 15m scripts/icp/run-treasury-payment-operation-lost-reply-proof.sh 2>&1 | tee .mops/m1-treasury-payment-operation-lost-reply-proof/proof.log
      - name: Retain proof artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-treasury-payment-operation-lost-reply-${{ github.run_id }}
          path: .mops/m1-treasury-payment-operation-lost-reply-proof
          if-no-files-found: warn

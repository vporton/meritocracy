[dependencies]
# Owner-approved M1 compatibility fork of released identify@0.0.2. Its scope
# is restricted to excluding non-library frontend E2E actors and binding its
# backend to Core 1 explicitly; see packages/identify-m1-compat/COMPATIBILITY.md.
identify = "./packages/identify-m1-compat"
# Owner-directed M1 replacement for released hex@1.0.2, which cannot compile
# under the pinned Motoko 1.4.1 Text.join signature. The public import remains
# `mo:hex`; see scripts/icp/verify-hex-m1-compat.sh.
hex = "./packages/hex-m1-compat"
# This package remains diagnostic-only until the M1 storage proofs approve a
# specific authoritative use. The Mops lock is the package-content pin; the
# earlier remote-CanisterDB Git pin remains separate historical evidence.
zendb = "2.0.1"
# Owner-authorized, exact M1 compatibility fork of the released package. It
# adds only the missing BaseMemoryBTree.bytes alias used by its own BTree-set
# wrapper; see scripts/icp/verify-memory-collection-m1-compat.sh.
"memory-collection@0.4" = "./packages/memory-collection-m1-compat"
# ZenDB imports its required Core 2.4 line explicitly. The compatibility fork
# retains identify on its audited Core 1 line through explicit imports.
"core@2.2" = "2.2.0"
# The exact ZenDB v2.0.1 and memory-collection@0.4.0 sources import this
# version-qualified Core line.  Keep it direct so Mops binds `mo:core@2.4`
# to its matching package rather than the retained OAuth Core-1 closure.
"core@2.4" = "2.4.0"
# `identify`'s transitive `hash` package imports this historical package name.
# Keep the import name for source compatibility, but resolve it to the exact
# Motoko 1.4.1-compatible motoko-base source rather than its pre-1.4 commit.
"base-0.7.3" = "https://github.com/dfinity/motoko-base#d1b336e142bec76577e3d63d9f1fac74de48df0a"
"base@0.7.3" = "https://github.com/dfinity/motoko-base#d1b336e142bec76577e3d63d9f1fac74de48df0a"

[toolchain]
moc = "1.4.1"
pocket-ic = "12.0.0"

[moc]
# Motoko 1.4 requires an explicit Candid definition for the management
# canister imported by the pinned `identify` package. The checked-in
# declaration provides reproducible compiler resolution.
args = ["--actor-idl=canisters/shared/system_idl"]

[canisters.application_canister]
main = "canisters/application/main.mo"
candid = "canisters/application/application_canister.did"

[canisters.application_canister.check-stable]
path = "deployed/application_canister.most"

[canisters.treasury_canister]
main = "canisters/treasury/main.mo"
candid = "canisters/treasury/treasury_canister.did"

[canisters.treasury_canister.check-stable]
path = "deployed/treasury_canister.most"

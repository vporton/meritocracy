[[services]]
protocol = 'tcp'
internal_port = 3001
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[services.ports]]
port = 80
handlers = ['http']
force_https = true

[[services.ports]]
port = 443
handlers = ['tls', 'http']

[[services.tcp_checks]]
interval = '2s'
timeout = '2s'
grace_period = '60s'

[[vm]]
# memory = '512mb'  # not enough
memory = '1024mb'  # <=2GB to be eligible for suspend
cpus = 1
memory_mb = 512

name: M1 consolidated application migration receipt PocketIC proof

on:
  pull_request:
    paths:
      - 'canisters/application/EmbeddedMigrationReceiptStore.mo'
      - 'canisters/archive_router/MigrationReceiptIntent.mo'
      - 'canisters/shared/MutationRecovery.mo'
      - 'fixtures/application/EmbeddedMigrationReceiptStoreProof.mo'
      - 'scripts/icp/build-application-embedded-migration-receipt-proof.sh'
      - 'scripts/icp/run-application-embedded-migration-receipt-proof.sh'
      - 'scripts/icp/embedded-migration-receipt-pocketic-proof.cjs'
      - 'scripts/icp/run-application-embedded-migration-receipt-capacity-proof.sh'
      - 'scripts/icp/application-embedded-migration-receipt-capacity-pocketic-proof.cjs'
      - 'scripts/icp/run-application-embedded-migration-receipt-low-cycle-proof.sh'
      - 'scripts/icp/application-embedded-migration-receipt-low-cycle-pocketic-proof.cjs'
      - '.github/workflows/m1-application-embedded-migration-receipt.yml'
      - 'mops.toml'
      - 'mops.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocketic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm ci
      - name: Install locked Motoko dependencies
        run: node node_modules/ic-mops/dist/bin/mops.js install --lock check
      - name: Cache pinned PocketIC toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mops
            ~/.local/share/mops
          key: m1-application-migration-receipt-pocketic-${{ runner.os }}-12.0.0-${{ hashFiles('mops.toml', 'mops.lock') }}
      - name: Build synthetic application fixture
        run: |
          mkdir -p .mops/m1-application-embedded-migration-receipt-proof
          scripts/icp/build-application-embedded-migration-receipt-proof.sh 2>&1 | tee .mops/m1-application-embedded-migration-receipt-proof/build.log
      - name: Run synthetic application fixture
        run: |
          timeout 15m scripts/icp/run-application-embedded-migration-receipt-proof.sh 2>&1 | tee .mops/m1-application-embedded-migration-receipt-proof/proof.log
      - name: Run bounded private-adapter capacity fixture
        run: |
          timeout 15m scripts/icp/run-application-embedded-migration-receipt-capacity-proof.sh 2>&1 | tee .mops/m1-application-embedded-migration-receipt-proof/capacity.log
      - name: Run private-adapter low-cycle recovery fixture
        run: |
          timeout 15m scripts/icp/run-application-embedded-migration-receipt-low-cycle-proof.sh 2>&1 | tee .mops/m1-application-embedded-migration-receipt-proof/low-cycle.log
      - name: Retain proof artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-application-embedded-migration-receipt-${{ github.run_id }}
          path: .mops/m1-application-embedded-migration-receipt-proof
          if-no-files-found: warn
          retention-days: 14
